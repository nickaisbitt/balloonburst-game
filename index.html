      <div style="max-width: 40rem; margin: 2rem auto; padding: 0 1.25rem; font-family: system-ui, sans-serif; color: #1e293b; line-height: 1.6;">
        <h1>Balloon Burst — Tower Defense</h1>
        <p>Balloon Burst is a free, cheerful balloon-popping tower defense game that plays right in your browser — no account, no download, nothing to install. JavaScript is required to play.</p>
        <h2>How to play</h2>
        <ul>
          <li>Balloons follow the path toward your castle. Tap a tower, then tap the map to place it — every balloon you pop earns cash.</li>
          <li>Spend cash on more towers or upgrades. 20 towers, from simple darts to spike factories, wizards and heroes.</li>
          <li>Survive every wave to win the map. 123 handmade maps across 10 worlds, three difficulties, daily challenges, weekly cups and weekend tournaments.</li>
        </ul>
        <h2>Features</h2>
        <ul>
          <li>Plays instantly, even on older phones — one small file, no loading screens.</li>
          <li>Your progress stays on your device. No account, no sign-up, no tracking on the web version.</li>
          <li>Offline-friendly: install it as an app and it runs without a network.</li>
          <li>Available in English, Español, Français and Deutsch.</li>
        </ul>
      </div>
    </noscript>
